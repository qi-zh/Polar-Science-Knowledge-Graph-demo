name: pskg-paper-demo

services:
  neo4j:
    image: neo4j:5.26.30-community@sha256:bb268a2f1b4f3c79e4bd1a00a82a6e63bbd4fcc4088da03c1b2380655f256cb2
    environment:
      NEO4J_AUTH: neo4j/demo-only-password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p demo-only-password -d neo4j 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    labels:
      org.pskg.paper-demo.managed: "true"
      org.pskg.paper-demo.owner: pskg-paper-demo
      org.pskg.paper-demo.directory: ${PSKG_DEMO_DIRECTORY:?Use the supplied shell scripts}
    volumes:
      - graph_data:/data
    networks:
      - demo

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pskg-paper-demo-app:local
    user: "${PSKG_DEMO_UID:?Use the supplied shell scripts}:${PSKG_DEMO_GID:?Use the supplied shell scripts}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PSKG_DEMO_CONTAINER: "1"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: demo-only-password
      NEO4J_DATABASE: neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    labels:
      org.pskg.paper-demo.managed: "true"
      org.pskg.paper-demo.owner: pskg-paper-demo
      org.pskg.paper-demo.directory: ${PSKG_DEMO_DIRECTORY:?Use the supplied shell scripts}
    volumes:
      - type: bind
        source: ./outputs
        target: /app/outputs
        bind:
          create_host_path: false
    networks:
      - demo

networks:
  demo:
    name: pskg-paper-demo-network
    internal: true
    labels:
      org.pskg.paper-demo.managed: "true"
      org.pskg.paper-demo.owner: pskg-paper-demo
      org.pskg.paper-demo.directory: ${PSKG_DEMO_DIRECTORY:?Use the supplied shell scripts}

volumes:
  graph_data:
    name: pskg-paper-demo-data
    labels:
      org.pskg.paper-demo.managed: "true"
      org.pskg.paper-demo.owner: pskg-paper-demo
      org.pskg.paper-demo.directory: ${PSKG_DEMO_DIRECTORY:?Use the supplied shell scripts}
